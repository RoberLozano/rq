<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Añadir libro por ISBN</title>
  <style>
    :root {
      color-scheme: light;
      --borde: #dcdce0;
      --acento: #26262b;
      --sobre-acento: #ffffff;
      --error: #b3261e;
      --ok: #146c2e;
      --fondo: #ffffff;
      --texto: #17171a;
      --tenue: #5f5f66;
    }

    /* Paleta casi negra, gris y blanco: sin azul. */
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --borde: #242428;
        --acento: #ededf0;
        --sobre-acento: #08080a;
        --error: #ff9d97;
        --ok: #8fd7a0;
        --fondo: #050506;
        --texto: #f0f0f2;
        --tenue: #96969e;
      }
    }

    * { box-sizing: border-box; }

    /* Sin esto, #lectura-form { display:flex } le gana al atributo hidden. */
    [hidden] { display: none !important; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.45;
      background: var(--fondo);
      color: var(--texto);
    }

    main { max-width: 640px; margin: 0 auto; padding: 1rem; }

    h1 { font-size: 1.4rem; margin: 0 0 .3rem; }
    h2 { font-size: 1.2rem; margin: 0 0 .2rem; }
    p { margin: .4rem 0; }

    a {
      color: inherit;
      text-decoration: underline;
      text-decoration-color: var(--tenue);
      text-underline-offset: 2px;
    }

    a:hover { text-decoration-color: currentColor; }

    .buscador { display: flex; gap: .5rem; margin-top: .8rem; }

    input[type="text"], input[type="number"], input[type="date"], select, textarea {
      padding: .6rem;
      font-size: 1rem;
      border: 1px solid var(--borde);
      border-radius: .4rem;
      background: var(--fondo);
      color: var(--texto);
      min-width: 0;
    }

    textarea { resize: vertical; line-height: 1.45; font-family: inherit; }

    /* La lista desplegable la pinta el sistema: sin colores propios se queda
       en blanco con el texto del tema oscuro (o al revés). */
    select option {
      background: var(--fondo);
      color: var(--texto);
    }

    #isbn { flex: 1; }

    ::placeholder { color: var(--tenue); }

    button {
      padding: .6rem .9rem;
      font-size: 1rem;
      border-radius: .4rem;
      border: 1px solid var(--acento);
      background: var(--acento);
      color: var(--sobre-acento);
      cursor: pointer;
    }

    button.sec { background: transparent; color: inherit; border-color: var(--borde); }
    button:disabled { opacity: .5; cursor: default; }

    .fuentes { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .8rem; }

    label.archivo {
      display: inline-block;
      padding: .6rem .9rem;
      border: 1px dashed var(--borde);
      border-radius: .4rem;
      cursor: pointer;
    }

    label.archivo input { display: none; }

    #camara {
      position: relative;
      margin-top: .8rem;
      overflow: hidden;
      border-radius: .5rem;
      background: #000;
    }

    #camara video, #camara canvas { width: 100%; height: auto; display: block; }

    /* En el OCR el vídeo se limita en alto para que los botones de la foto
       sigan a la vista en el móvil; el recuadro se coloca en píxeles. */
    #camara video.video-ocr {
      width: auto;
      max-width: 100%;
      max-height: 60vh;
      margin: 0 auto;
      cursor: pointer;
    }

    /* Máscara: una caja del tamaño de la vista previa cuyos bordes oscurecen
       todo menos el recuadro (el hueco central). */
    #mascara-ocr {
      position: absolute;
      inset: 0;
      border: 0 solid rgba(0, 0, 0, .55);
      pointer-events: none;
    }

    #guia-ocr {
      position: absolute;
      border: 2px solid rgba(255, 255, 255, .9);
      border-radius: .35rem;
      pointer-events: none;
    }

    /* Capa transparente que recibe el toque: el <video> no siempre lo propaga. */
    #disparo-ocr {
      position: absolute;
      inset: 0;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    #estado { min-height: 1.5em; margin: .8rem 0; }
    #estado.error { color: var(--error); }
    #estado.ok { color: var(--ok); }

    #resultado {
      border: 1px solid var(--borde);
      border-radius: .6rem;
      padding: 1rem;
    }

    #portada {
      max-height: 150px;
      float: right;
      margin: 0 0 .5rem .8rem;
      border-radius: .3rem;
    }

    dl {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: .2rem .8rem;
      margin: .8rem 0 0;
    }

    dt { font-weight: 600; }
    dd { margin: 0; }

    /* Tarjeta editable: los datos se revisan y corrigen antes de guardar. */
    #form-ficha { clear: both; margin-top: .8rem; }

    .rejilla {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: .7rem;
    }

    #form-ficha label {
      display: flex;
      flex-direction: column;
      gap: .25rem;
      font-size: .8rem;
      color: var(--tenue);
    }

    #form-ficha label.ancho { grid-column: 1 / -1; margin-top: .7rem; }

    #form-ficha input, #form-ficha textarea { width: 100%; }

    #paginas-nota { font-size: .75rem; }

    /* Datos del autor que se creará al guardar el libro. */
    #autor-nuevo {
      clear: both;
      margin-top: .9rem;
      padding: .6rem .8rem;
      border: 1px solid var(--borde);
      border-radius: .5rem;
    }

    #autor-nuevo p { margin: .2rem 0; font-size: .9rem; }
    #autor-nuevo-texto { color: var(--texto); }

    #lectura-caja {
      border: 1px solid var(--borde);
      border-radius: .6rem;
      padding: .8rem;
      margin: 1rem 0;
    }

    #lectura-form { display: flex; flex-wrap: wrap; gap: .8rem; margin-top: .6rem; }
    #lectura-form label { display: flex; flex-direction: column; font-size: .9rem; gap: .2rem; }
    .acciones-lectura { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .6rem; }

    /* Varias fichas con el mismo título y autor: decide el usuario. */
    #existente-caja { margin-top: 1rem; }
    #existente-caja label { display: block; font-size: .9rem; margin-bottom: .3rem; }
    #existente-lista { width: 100%; }

    /* Lecturas anteriores del mismo libro, plegadas tras el enlace. */
    #ultima-lectura { margin: .2rem 0 0; }
    #lista-previas {
      margin: .4rem 0 0;
      padding-left: 1.1rem;
      font-size: .9rem;
      color: var(--tenue);
    }
    #lista-previas li { margin-bottom: .15rem; }

    @media (max-width: 420px) {
      .buscador { flex-direction: column; }
    }
  </style>
</head>

<body>
  <main>
    <h1>Añadir libro</h1>
    <p>Escanea el código de barras, haz una foto del número o escribe el ISBN.
      <a href="consulta.html">Ver la biblioteca</a></p>

    <div class="buscador">
      <input id="isbn" type="text" inputmode="numeric" autocomplete="off"
        placeholder="ISBN (10 o 13 dígitos)" aria-label="ISBN">
      <button id="btn-buscar">Buscar</button>
    </div>

    <div class="fuentes">
      <button id="btn-camara" class="sec">Escanear con cámara</button>
      <button id="btn-detener" class="sec" hidden>Detener cámara</button>
      <label class="archivo">Foto del código<input id="archivo-codigo" type="file" accept="image/*"></label>
      <button id="btn-ocr-camara" class="sec">Hacer foto del número (OCR)</button>
    </div>

    <div id="camara" hidden></div>
    <div class="fuentes" id="acciones-foto" hidden>
      <button id="btn-foto">Hacer foto</button>
      <button id="btn-cancelar-foto" class="sec">Cancelar</button>
    </div>
    <p id="estado" role="status" aria-live="polite"></p>

    <section id="resultado" hidden>
      <img id="portada" alt="" hidden>
      <h2 id="titulo"></h2>
      <p id="autores"></p>
      <p class="nota" id="wikipedia-caja" hidden>
        <a id="wikipedia-enlace" href="#" target="_blank" rel="noopener"></a>
      </p>

      <form id="form-ficha" novalidate>
        <p class="nota">Puedes corregir estos datos antes de guardar.</p>
        <div class="rejilla">
          <label>Título <input type="text" id="f-titulo"></label>
          <label>Autor <input type="text" id="f-autor"></label>
          <label>Año de la obra
            <input type="number" id="f-anio" min="1" max="2100" step="1">
          </label>
          <label>Año de la edición
            <input type="number" id="f-anioedicion" min="1" max="2100" step="1">
          </label>
          <label>Páginas
            <input type="number" id="f-npaginas" min="1" step="1">
            <span class="nota" id="paginas-nota" hidden></span>
          </label>
          <label>Idioma <input type="text" id="f-idioma" list="lista-idiomas"></label>
          <label>Género <input type="text" id="f-genero" list="lista-generos"></label>
          <label>Nota media
            <input type="number" id="f-nota" min="0" max="10" step="0.1">
          </label>
        </div>
        <label class="ancho">Sinopsis <textarea id="f-sinopsis" rows="9"></textarea></label>
      </form>

      <div id="autor-nuevo" hidden>
        <p id="autor-nuevo-texto"></p>
        <p id="autor-nuevo-wikipedia" hidden>
          <a id="autor-nuevo-enlace" href="#" target="_blank" rel="noopener"></a>
        </p>
      </div>

      <dl id="datos"></dl>

      <div id="lectura-caja">
        <p class="nota" id="lectura-aviso">Guarda el libro para poder registrar una lectura.</p>
        <div class="acciones-lectura">
          <button type="button" id="btn-empezar" disabled>Empezar a leer</button>
        </div>
        <div id="lectura-form" hidden>
          <label>Inicio <input type="date" id="fecha-inicio"></label>
          <label>Fin (si ya lo has acabado) <input type="date" id="fecha-fin"></label>
          <label>Formato
            <select id="formato">
              <option value="libro">libro</option>
              <option value="e-book">e-book</option>
              <option value="impreso">impreso</option>
              <option value="otro">otro</option>
            </select>
          </label>
          <div class="acciones-lectura">
            <button type="button" id="btn-registrar-lectura">Registrar lectura</button>
            <button type="button" id="btn-cancelar-lectura" class="sec">Cancelar</button>
          </div>
        </div>
        <p class="nota">
          <a href="consulta.html?pestana=curso">Ver lecturas en curso en la biblioteca</a>
          · <a href="#" id="btn-previas" hidden>Ver lecturas previas</a>
        </p>
        <p class="nota" id="ultima-lectura" hidden></p>
        <ul id="lista-previas" hidden></ul>
      </div>

      <div id="existente-caja" hidden>
        <label for="existente-lista">Ese título ya está en tu base. Elige la ficha:</label>
        <select id="existente-lista"></select>
      </div>

      <button id="btn-guardar">Guardar en Firebase</button>
    </section>
  </main>

  <datalist id="lista-idiomas"></datalist>
  <datalist id="lista-generos"></datalist>

  <script src="quagga.min.js"></script>
  <script src="firebase-config.js"></script>
  <script src="lector.js"></script>
</body>

</html>
